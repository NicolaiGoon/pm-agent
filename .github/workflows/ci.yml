name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version pinned here on purpose: the action reads `packageManager`
      # from package.json, so CI uses exactly the pnpm the repo declares.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Must satisfy engines.node in package.json. Node 22 silently skips
          # native optional dependencies (rolldown), so do not lower this.
          node-version: 24
          cache: pnpm

      # --frozen-lockfile fails rather than resolving anything new, so CI
      # installs byte-identical dependencies. Under pnpm 12 this also runs the
      # supply-chain policy check (minimumReleaseAge).
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      # next build re-checks types for apps/web, but it is the only step that
      # catches build-time failures such as a client/server boundary violation.
      - run: pnpm build

  # The state machine, its guard triggers and RLS are the parts the HLD says
  # must never be wrong. They live in SQL, so no amount of TypeScript testing
  # covers them — this job is what protects them.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Starting the stack applies every migration to a fresh database, so the
      # suite always runs against a clean schema with no leftover rows. pgTAP
      # tests roll back, but they still collide with pre-existing fixtures.
      - name: Start Supabase
        run: pnpm supabase start

      - name: Run pgTAP suite
        run: pnpm db:test

      - name: Stop Supabase
        if: always()
        run: pnpm supabase stop --no-backup
