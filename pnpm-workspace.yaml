packages:
  - apps/*
  - packages/*

# Single source of truth for versions shared across packages.
# Bump here, not in individual package.json files.
catalog:
  typescript: ^6.0.3
  vitest: ^5.0.1
  zod: ^4.6.5
  "@types/node": ^22.18.0

# Native postinstall builds, explicitly decided (pnpm 12 requires a choice per
# package). Allowing these to build natively avoids the wasm-fallback failures
# that cost us an afternoon on rolldown.
allowBuilds:
  sharp: true
  unrs-resolver: true
